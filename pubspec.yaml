name: simplex_cli
description: A CLI tool to scaffold Clean Architecture feature modules for Flutter projects using the Simplex library (SimplexCubit, PagingCubit, freezed, injectable).
version: 0.1.0
homepage: https://github.com/basnetjiten/simplex_cli
repository: https://github.com/basnetjiten/simplex_cli
issue_tracker: https://github.com/basnetjiten/simplex_cli/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

executables:
  simplex: simplex

dependencies:
  args: ^2.7.0
  interact: ^2.2.0
  mason: ^0.1.2
  mason_logger: ^0.3.5
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_writer: ^2.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
