name: model
description: Generates a Simplex Model, Data Source, and Repository.
version: 0.1.0

vars:
  feature_name:
    type: string
    description: Feature name in snake_case
  feature_class:
    type: string
    description: Feature class name in PascalCase
  model_name:
    type: string
    description: Model name in snake_case
  model_class:
    type: string
    description: Model class in PascalCase
  package_name:
    type: string
    description: Package name for imports
  use_graphql:
    type: boolean
    description: Use GraphQL for the data source
    default: true
