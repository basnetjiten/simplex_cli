name: source
description: Generates a remote source interface (domain/) and its concrete implementation (data/).
version: 0.1.0

vars:
  feature_name:
    type: string
    description: Feature name in snake_case (e.g. auth)

  source_name:
    type: string
    description: Source name in snake_case (e.g. auth_remote_source)

  source_class:
    type: string
    description: Source class prefix in PascalCase (e.g. AuthRemote)

  package_name:
    type: string
    description: Dart package name used in import paths

  use_graphql:
    type: boolean
    description: Use GraphQL (ferry) for the data source implementation
    default: true

  create_abstract:
    type: boolean
    description: Whether to create the static interface (domain/)
    default: true

  create_impl:
    type: boolean
    description: Whether to create the concrete implementation (data/)
    default: true
