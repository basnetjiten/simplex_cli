name: domain
description: Generates a freezed domain entity and a use-case stub inside a feature's domain/ folder.
version: 0.1.0

vars:
  feature_name:
    type: string
    description: Feature name in snake_case (e.g. auth)

  entity_name:
    type: string
    description: Entity file name in snake_case (e.g. user)

  entity_class:
    type: string
    description: Entity class name in PascalCase (e.g. User)

  package_name:
    type: string
    description: Dart package name used in import paths
