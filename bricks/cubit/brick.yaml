name: cubit
description: Generates a Simplex Cubit and State.
version: 0.1.0

vars:
  feature_name:
    type: string
    description: Feature name in snake_case
  feature_class:
    type: string
    description: Feature class name in PascalCase
  package_name:
    type: string
    description: Package name for imports
  cubit_name:
    type: string
    description: Cubit name in snake_case
  cubit_class:
    type: string
    description: Cubit class name in PascalCase
  use_paging:
    type: boolean
    description: Whether to include paging support
    default: false
